    @keyframes blink {

      animation: blink 1s step-end infinite;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

      animation: fadeInUp 0.4s ease-out 0.4s forwards;
      opacity: 0;
    }

  <script>
    // Video Mouse Scrubbing
    const video = document.getElementById('bgVideo');
    let prevX = null;
    let targetTime = 0;
    let isSeeking = false;

    window.addEventListener('mousemove', (e) => {
      if (!video || !video.duration) return;

      if (prevX === null) {
        prevX = e.clientX;
        return;
      }

      const delta = e.clientX - prevX;
      prevX = e.clientX;

      const SENSITIVITY = 0.8;
      const timeOffset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
      targetTime = Math.max(0, Math.min(video.duration, targetTime + timeOffset));

      if (!isSeeking) {
        isSeeking = true;
        video.currentTime = targetTime;
      }
    });

    video.addEventListener('seeked', () => {
      if (Math.abs(video.currentTime - targetTime) > 0.05) {
        video.currentTime = targetTime;
      } else {
        isSeeking = false;
      }
    });

    // Typewriter Effect
    const fullText = "Admin & Operations professional specializing in cargo logistics, document control, and customer service. How can we collaborate?";
    const textEl = document.getElementById('typewriterText');
    const cursorEl = document.getElementById('cursor');
    let index = 0;

    setTimeout(() => {
      const interval = setInterval(() => {
        if (index < fullText.length) {
          textEl.textContent += fullText.charAt(index);
          index++;
        } else {
          clearInterval(interval);
          cursorEl.style.display = 'none';
        }
      }, 35);
    }, 500);

    // Mobile Navigation Toggle
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    let isOpen = false;

    menuBtn.addEventListener('click', () => {
      isOpen = !isOpen;
      if (isOpen) {
        mobileMenu.classList.remove('pointer-events-none', 'opacity-0');
        mobileMenu.classList.add('pointer-events-auto', 'opacity-100');
        bar1.classList.add('translate-y-[7px]', 'rotate-45');
        bar2.classList.add('opacity-0');
        bar3.classList.add('-translate-y-[7px]', '-rotate-45');
      } else {
        mobileMenu.classList.add('pointer-events-none', 'opacity-0');
        mobileMenu.classList.remove('pointer-events-auto', 'opacity-100');
        bar1.classList.remove('translate-y-[7px]', 'rotate-45');
        bar2.classList.remove('opacity-0');
        bar3.classList.remove('-translate-y-[7px]', '-rotate-45');
      }
    });

    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        isOpen = false;
        mobileMenu.classList.add('pointer-events-none', 'opacity-0');
        mobileMenu.classList.remove('pointer-events-auto', 'opacity-100');
        bar1.classList.remove('translate-y-[7px]', 'rotate-45');
        bar2.classList.remove('opacity-0');
        bar3.classList.remove('-translate-y-[7px]', '-rotate-45');
      });
    });

    // Copy Email Function
    function copyEmail() {
      navigator.clipboard.writeText("mohdabzan2003@gmail.com");
      alert("Email address copied to clipboard!");
    }
  </script>
